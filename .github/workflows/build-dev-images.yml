# Builds DEVELOPMENT images from the self-hosted repo, pushes to ghcr.io, then
# auto-deploys to Droplet B (pull + migrate + restart).
#
# Dedicated image names (pageden-dev-*) so they never clobber the public
# self-hosted pageden-server / pageden-web images published by docker.yml,
# nor the cloud staging/prod images.
#
# The dev instance is served at go.pageden.dev (basic-auth gated) via the
# shared edge on Droplet B. See the staging-dev runbook in the pageden-cloud repo.
name: Build Dev Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to build (defaults to the triggering ref)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: ghcr.io/pageden/pageden-dev-server
            dockerfile: apps/server/Dockerfile
            build-args: ""
          - name: web
            image: ghcr.io/pageden/pageden-dev-web
            dockerfile: apps/web/Dockerfile
            # Self-hosted dev: bake the dev domain. No Mixpanel/Sentry (self-hosted
            # no-ops when those are empty), so they are intentionally omitted.
            build-args: |
              VITE_WORKSPACE_BASE_DOMAIN=pageden.dev
              VITE_APP_ENV=development
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.name }}

  # Auto-deploy the freshly-built images to Droplet B (dev). Only on main.
  # Host + SSH key come from repo secrets (no infra IP in this public repo).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging-dev
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PAGEDEN_STAGINGDEV_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.STAGINGDEV_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull + migrate + restart dev on Droplet B
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "root@${{ secrets.STAGINGDEV_HOST }}" "set -euo pipefail
            cd /opt/pageden-staging-dev
            docker compose pull dev-server dev-web
            docker compose run --rm dev-migrate pnpm --filter @pageden/server db:migrate:deploy
            docker compose up -d dev-server dev-web
            docker image prune -f >/dev/null 2>&1 || true
          "
      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "root@${{ secrets.STAGINGDEV_HOST }}" \
            'cid=$(cd /opt/pageden-staging-dev && docker compose ps -q dev-server); docker exec "$cid" node -e "fetch(\"http://localhost:4000/api/ready\").then(r=>{if(!r.ok){process.exit(1)}else{console.log(\"dev healthy\")}}).catch(e=>{console.error(e);process.exit(1)})"'
