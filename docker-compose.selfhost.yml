services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pageden}
      POSTGRES_USER: ${POSTGRES_USER:-pageden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${PAGEDEN_SERVER_IMAGE:-pageden-server:selfhost}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pageden}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pageden}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?Set TOKEN_HASH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CLOUD_HOSTED: "false"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_ROOT: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@pageden/server", "db:migrate:deploy"]

  seed:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${PAGEDEN_SERVER_IMAGE:-pageden-server:selfhost}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pageden}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pageden}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?Set TOKEN_HASH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CLOUD_HOSTED: "false"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_ROOT: /data/storage
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "--filter", "@pageden/server", "db:seed:deploy"]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${PAGEDEN_SERVER_IMAGE:-pageden-server:selfhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-pageden}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pageden}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?Set TOKEN_HASH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CLOUD_HOSTED: "false"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_ROOT: /data/storage
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - pageden_storage:/data/storage
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${PAGEDEN_WEB_IMAGE:-pageden-web:selfhost}
    restart: unless-stopped
    ports:
      - "${PAGEDEN_WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  pageden_storage:
